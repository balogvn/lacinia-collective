name: Deploy to Pages

# Publishes the app AND the commons to the same origin, so a device's sync
# source is same-origin and no CORS configuration is needed anywhere. The
# commons files live under public/, so `next build` copies them into the export
# automatically — the site and the data it syncs from ship together.
on:
  push:
    branches: [main]
    # An inbox write must not rebuild the site. The aggregate workflow picks it
    # up, merges it, and calls this workflow itself when the snapshot changes,
    # so a rebuild here would be a duplicate of a deploy that is already coming.
    paths-ignore:
      - 'commons/inbox/**'
  workflow_dispatch:
  # Called by aggregate.yml. Pushes made with the default GITHUB_TOKEN do not
  # trigger workflows — GitHub refuses, to stop a job re-triggering itself — so
  # the aggregator's snapshot commit reached main and never reached Pages. A
  # reusable call closes that without a personal access token: no long-lived
  # secret, and nothing new that can write to this repository.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy midway, but only one at a time. The aggregation job
# commits to main and therefore triggers this — queueing keeps the newest
# commons winning without two deploys racing to publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # ALWAYS main, never the triggering sha.
      #
      # When aggregate.yml calls this workflow, the default checkout resolves
      # to the caller's sha — which is the commit BEFORE the aggregator pushed
      # its snapshot. The deploy would faithfully publish the state from just
      # before the merge, so the fix for the missing deploy would itself have
      # published nothing new. This workflow only ever serves main, so naming
      # it is both correct and the simplest thing that cannot drift.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # No point publishing a build whose engines are broken.
      - name: Verify engines
        run: npm run verify

      - name: Build static export
        env:
          # GitHub Pages serves project repos from /<repo>/. Without this every
          # asset, the service worker and the PWA scope resolve to the origin
          # root and 404.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
        run: npx next build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
