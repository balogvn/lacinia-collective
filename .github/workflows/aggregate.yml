name: Aggregate commons

# The free compute layer. GitHub Actions gives public repositories unlimited
# minutes, so the daily merge/compaction job that would otherwise need a server
# costs nothing — which is the whole reason the architecture has no server.
on:
  schedule:
    # 03:00 UTC = 04:00 WAT, before the morning peak in Nigeria.
    - cron: '0 3 * * *'
  # Aggregate as soon as a bundle lands, not only on the daily tick.
  push:
    paths:
      - 'commons/inbox/**'
  workflow_dispatch:

# Least privilege: the job writes the snapshot back to the repo and nothing else.
permissions:
  contents: write

concurrency:
  # Never run two aggregations at once — both would read the same snapshot and
  # the second push would silently discard the first run's merged ops.
  group: aggregate-commons
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Only @noble/* is needed by the aggregator, but a lockfile install keeps
      # CI reproducible and lets the verification suites run in the same job.
      - run: npm ci

      # If the engine is broken there is no point publishing a snapshot from it.
      - name: Verify protocol and sync engines
        run: npm run verify

      - name: Aggregate and compact
        run: npm run aggregate

      # Opinion clustering over the merged commons. Advisory only — every
      # device recomputes the same thing locally from its own view, using the
      # very module this step imports.
      - name: Analyse deliberation
        run: npm run analyse

      - name: Commit snapshot
        id: commit
        run: |
          git config user.name  'lacinia-aggregator'
          git config user.email 'aggregator@users.noreply.github.com'
          git add public/commons commons/inbox
          if git diff --staged --quiet; then
            echo 'No change to the commons.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "commons: aggregate $(date -u +%Y-%m-%d)"
          # Rebase rather than force: a contributor's bundle landing mid-run
          # must not be discarded.
          git pull --rebase --autostash
          git push
          echo 'changed=true' >> "$GITHUB_OUTPUT"

  # Publish what was just merged.
  #
  # Without this the snapshot reached main and stopped there: a push made with
  # the default GITHUB_TOKEN does not trigger another workflow, so deploy.yml
  # never ran for an aggregator commit. Confirmed on this repository — commit
  # e628e57 has no deploy run against its sha. The live commons only moved when
  # some unrelated push happened to deploy afterwards, which made merged
  # bundles look published while the site served the old snapshot.
  #
  # Skipped when nothing changed, so the daily cron on a quiet commons costs a
  # single 30-second job rather than a full site rebuild.
  publish:
    needs: aggregate
    if: needs.aggregate.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
