<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Lacinia">
  <rect width="512" height="512" fill="#0B4A33"/>
  <!--
    A lacinia is the deep lobe of a leaf — a shape defined by its divisions.
    The mark is one leaf cut into separate lobes that still share a spine:
    distinct parts, common stem. Same idea as the trust graph.
  -->
